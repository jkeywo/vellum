[workspace]
resolver = "2"
members = [
  "crates/vellum-digest",
]

[workspace.package]
version = "0.1.0"
# The conservative of the two consumers. Editions are per-crate, so
# project-murmur's 2024 crates can depend on these; the reverse would not
# work, and moving rogue-hunter to 2024 is rogue-hunter's decision to make on
# its own schedule rather than a side effect of an extraction.
edition = "2021"
rust-version = "1.95.0"
repository = "https://github.com/jkeywo/vellum"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Pinned to exactly what rogue-hunter already resolves. postcard's version is
# in the byte-layout path: a share code is postcard bytes behind a CRC, so a
# postcard upgrade that changed an encoding would invalidate every saved run.
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
base64 = "0.22.1"
ron = "0.12"

[workspace.lints.rust]
# The stricter of the two consumers.
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
