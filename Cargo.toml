[workspace]
resolver = "2"
members = [
  "crates/vellum-compose",
  "crates/vellum-corpus",
  "crates/vellum-digest",
  "crates/vellum-editor",
  "crates/vellum-grid",
  "crates/vellum-perf",
  "crates/vellum-replay",
  "crates/vellum-rng",
  "crates/vellum-save",
  "crates/vellum-script",
  "crates/vellum-strings",
]

[workspace.package]
version = "0.1.0"
# The conservative of the two consumers. Editions are per-crate, so
# project-murmur's 2024 crates can depend on these; the reverse would not
# work, and moving rogue-hunter to 2024 is rogue-hunter's decision to make on
# its own schedule rather than a side effect of an extraction.
edition = "2021"
rust-version = "1.95.0"
repository = "https://github.com/jkeywo/vellum"
# Matches the LICENSE file in the repository root, and the consuming games.
license = "MIT"

[workspace.dependencies]
# Pinned to exactly what rogue-hunter already resolves. postcard's version is
# in the byte-layout path: a share code is postcard bytes behind a CRC, so a
# postcard upgrade that changed an encoding would invalidate every saved run.
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
base64 = "0.22.1"
ron = "0.12"
# Reports only (vellum-corpus's optional `json` feature); nothing in the
# byte-layout path emits JSON.
serde_json = "1"

# vellum-editor. These two are *version-coupled to the consumer*: a reflected
# value crosses the crate boundary, and `egui::Ui` must be the very type the
# consumer's `bevy_egui` re-exports, or the panel will not typecheck. Pinned
# to what the fleet standard (Bevy 0.19 / bevy_egui 0.41) resolves.
bevy_reflect = "0.19"
egui = "0.35"

# vellum-script. `no_float` because authored content is integer-only for
# determinism — a float in a saved campaign is a platform-dependent
# fingerprint waiting to happen.
rhai = { version = "1.25", features = ["sync", "no_float"] }

[workspace.lints.rust]
# The stricter of the two consumers.
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
