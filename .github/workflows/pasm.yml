name: PASM

# The Python package under pasm/ has its own workflow so that a docs or spec
# edit never burns a full consumer-smoke matrix run, and a crate change never
# waits on a Python environment. The spec-scan step checks paths across the
# whole tree (handbook, templates, workflows), so those paths trigger too —
# this job is cheap; the one being spared is the two-game smoke matrix.
on:
  push:
    branches: [main]
    paths:
      - "pasm/**"
      - "docs/**"
      - "templates/**"
      - "actions/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "pasm/**"
      - "docs/**"
      - "templates/**"
      - "actions/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Package tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pasm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync dev environment
        run: uv sync --group dev
      - name: Tests
        run: uv run pytest -q
      # The foundation models itself: vellum's own spec, checked by the same
      # tool the games run.
      - name: Validate vellum's spec
        run: uv run pasm validate spec --workspace-root ..
      - name: Scan the tree against the spec
        run: uv run pasm scan spec --json --workspace-root .. > /dev/null
