name: CI

# Scoped to the Rust surface. The consumer smoke matrix below checks out and
# builds two whole games, so a pasm/ or docs/ edit must not trigger it —
# those paths have their own workflows. If branch protection ever marks these
# jobs required, path-skipped runs report as "expected" and will block; this
# repo has no protection today, which is why the scoping is safe.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Format, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features

  consumers:
    name: Consumer smoke (${{ matrix.game.repo }})
    runs-on: ubuntu-latest
    # This is the coordination mechanism between the three repositories. Each
    # game pins a rev of this one; here we check the game out and build it
    # against this branch's HEAD instead. An engine change that would move a
    # game's golden fixtures therefore fails *here*, before the bump PR in that
    # game exists.
    #
    # The determinism suites are the point. A game that merely compiles against
    # a changed engine proves nothing: the failure being guarded against is a
    # run that stops reproducing, which only the pinned fixtures see.
    strategy:
      fail-fast: false
      matrix:
        game:
          # The terminal games need no system packages; necessary-work's
          # workspace test builds its Bevy client, which wants ALSA/udev on
          # ubuntu.
          - repo: jkeywo/project-murmur
            dir: project-murmur
            test: cargo test --workspace --exclude murmur-web
            apt: ""
          - repo: jkeywo/rogue-hunter
            dir: rogue-hunter
            test: cargo test --workspace
            apt: ""
          # Re-blessable tier, but its fixtures are pinned between blessings,
          # so "fixtures must not have moved" means the same thing here as for
          # the sacred two. Its determinism suite includes the seeded-bot
          # build orders, which is what a vellum change would actually break.
          - repo: jkeywo/necessary-work
            dir: necessary-work
            test: cargo test --workspace
            apt: libasound2-dev libudev-dev
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          path: vellum
      - name: Check out ${{ matrix.game.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.game.repo }}
          path: ${{ matrix.game.dir }}
      - name: System packages
        if: matrix.game.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.game.apt }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.game.dir }}
      - name: Point the game at this branch instead of its pinned rev
        working-directory: ${{ matrix.game.dir }}
        # The games depend on the engine by git URL, so a [patch] keyed on that
        # URL redirects every one of them at once. Written here rather than
        # committed to the game: a checked-in override would make its own CI
        # build whatever happened to be on disk.
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch."https://github.com/jkeywo/vellum"]
          vellum-corpus = { path = "../vellum/crates/vellum-corpus" }
          vellum-digest = { path = "../vellum/crates/vellum-digest" }
          vellum-grid = { path = "../vellum/crates/vellum-grid" }
          vellum-replay = { path = "../vellum/crates/vellum-replay" }
          vellum-rng = { path = "../vellum/crates/vellum-rng" }
          vellum-strings = { path = "../vellum/crates/vellum-strings" }
          EOF
      - name: Determinism suite
        working-directory: ${{ matrix.game.dir }}
        run: ${{ matrix.game.test }}
      - name: Fixtures must not have moved
        working-directory: ${{ matrix.game.dir }}
        # Belt and braces. The suites above already assert the fixtures, but a
        # test that quietly re-blessed one would still pass, and this would not.
        #
        # Scoped to the fixtures rather than the whole tree: applying a [patch]
        # rewrites Cargo.lock by design, since the dependency now resolves to a
        # path rather than the pinned git rev. That is this job working, not a
        # fixture moving.
        run: |
          moved=$(git diff --name-only -- '*golden*' '*fixture*' '*trace*')
          if [ -n "$moved" ]; then
            echo "A pinned fixture changed while testing against this engine:"
            git diff --stat -- '*golden*' '*fixture*' '*trace*'
            echo
            echo "This engine change alters what the game produces. Existing"
            echo "saves and share codes decode against the old behaviour."
            exit 1
          fi
