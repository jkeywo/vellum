# Fleet-level decisions: choices that bind all seven games. Game-level
# decisions stay in each game's own pasm/spec/core/decisions.yaml. Dates are
# the day the decision was accepted.
entities:
  - decision: vellum-is-the-fleet-home
    core:
      status: accepted
      confidence: confirmed
      title: Vellum is the fleet home (2026-07-25)
      summary: >
        Everything the games share lives in this one repository: engine
        crates, the PASM tool, the handbook, the reusable CI, the templates,
        and future shared crates. There is no shared engine and there will
        not be one; the games are different genres and their schedulers,
        generators, and renderers stay home.
      rationale:
        - >
          Two extractions already proved the pattern: PASM (byte-identical
          copies grown independently by two games) and the engine crates
          (the same layer written twice). Consolidating the shared surface
          into one pinned dependency keeps the games decoupled from each
          other while stopping every double-maintenance loop at once.

  - decision: pasm-consumed-as-subdirectory
    core:
      status: accepted
      confidence: confirmed
      title: PASM is consumed from this repository (2026-07-25)
      summary: >
        Games depend on the tool as "pasm @
        git+https://github.com/jkeywo/vellum@<rev>#subdirectory=pasm", pinned
        to a rev. The standalone jkeywo/pasm repository was kept untouched
        until every game had re-pointed and gone green, so existing pins kept
        resolving; that condition was met and the repository has been deleted.
        This directory is now the only copy of the tool, and any link to the
        old repository is a dead one.

  - decision: versions-are-policy-not-campaign
    core:
      status: accepted
      confidence: confirmed
      title: Version convergence is policy, not a campaign (2026-07-25)
      summary: >
        The fleet standard is Bevy 0.19, Rust 1.95.0 pinned by
        rust-toolchain.toml, and edition 2024 for new crates. A game adopts
        the standard when it is next actively developed. Nobody runs a
        Bevy-upgrade PR for its own sake.
      rationale:
        - >
          The games span Bevy 0.16 to 0.19 today and all of them work. An
          upgrade is real work with real risk, and it earns nothing until the
          game is being touched anyway.

  - decision: determinism-has-two-tiers
    core:
      status: accepted
      confidence: confirmed
      title: Fingerprint tiers, sacred and re-blessable (2026-07-25)
      summary: >
        For project-murmur and rogue-hunter the RNG byte stream and every
        digest are the save format: no shared-crate change may move them,
        enforced by the consumer smoke matrix. Every other game may adopt a
        shared crate by breaking and deliberately re-blessing its fixtures in
        the adopting PR, with the re-bless as its own reviewable commit.

  - decision: new-crates-need-a-consumer
    core:
      status: accepted
      confidence: confirmed
      title: Every new crate lands with a driving consumer (2026-07-25)
      summary: >
        A new shared crate merges together with the PR in which a real game
        adopts it. void-and-thunder is the designated first consumer for the
        planned testing (corpus), profiling, and data-composition crates: it
        is small, active, and has all three needs on its roadmap. Sacred
        games are extraction sources; void-and-thunder validates the API.

  - decision: fleet-ci-is-a-reusable-workflow
    core:
      status: accepted
      confidence: confirmed
      title: One reusable CI workflow, pinned by rev (2026-07-25)
      summary: >
        Games call .github/workflows/fleet-ci.yml from this repository as a
        thin caller pinned to a rev — the same pin-and-bump discipline as
        every other vellum dependency. The deploy job lives inside the same
        workflow, gated to main pushes, so a game carries exactly one caller
        file. Bespoke-CI repos reuse the composite actions instead.

  - decision: trunk-is-the-web-build
    core:
      status: accepted
      confidence: confirmed
      title: Trunk is the canonical web build (2026-07-25)
      summary: >
        Games build for the web with Trunk and deploy to GitHub Pages under
        /<repo-name>/. rogue-hunter's no-Bevy web client keeps wasm-pack as a
        documented exception; project-phoenix-v2 keeps its node pipeline
        around a Trunk core.

  - decision: uv-everywhere
    core:
      status: accepted
      confidence: confirmed
      title: uv manages every Python environment (2026-07-25)
      summary: >
        Every game's tooling pyproject uses uv with package = false and a
        committed uv.lock; pip-based setups migrate at adoption time. Local
        overrides against a vellum checkout use tool.uv.sources and are never
        committed active.

  - decision: content-formats-are-per-game
    core:
      status: accepted
      confidence: confirmed
      title: Rhai, RON, and TOML are all sanctioned (2026-07-25)
      summary: >
        Content format is a per-game choice; the fleet standardizes the
        loading patterns instead. Two are sanctioned: compile-time embedding
        for byte-identical native and wasm builds, and asset-loader loading
        where hot reload or an editor workflow needs it. The handbook's
        content chapter carries the details.

  - decision: composition-scheme-is-fleet-adoptable
    core:
      status: accepted
      confidence: confirmed
      title: The entity/world composition scheme spreads (2026-07-25)
      summary: >
        project-phoenix-v2's data model — entity templates, per-instance
        overrides, layered worlds, a thin selectable-root manifest, and
        all-or-nothing overlay packs — is documented format-neutrally in the
        handbook for any game to adopt in its own format. A shared
        composition crate is built only when void-and-thunder's data editor
        needs it, with phoenix's implementation as the design source.

  - decision: corpus-and-perf-are-the-next-crates
    core:
      status: accepted
      confidence: confirmed
      title: Testing and profiling are the next shared crates (2026-07-25)
      summary: >
        Every game runs (or has specified) seeded autonomous batches that
        emit deterministic reports; that batch-and-report shape is the next
        extraction, sourced from rogue-hunter and project-murmur's converged
        corpus code. A separate profiling crate follows project-phoenix-v2's
        cross-runtime measurement contract (its issue 868) and shares the
        report envelope. Both land with void-and-thunder as first consumer;
        collectors never enter sim crates.

  - decision: rng-unification-breaks-saves
    core:
      status: accepted
      confidence: confirmed
      title: The RNG converges on one entry point and one type, breaking saves once (2026-07-25)
      summary: >-
        The four historical entry points — two seeding policies and two
        bounded draws, fossils of two games that wrote the same generator
        independently — converge on Pcg32::seeded (the canonical PCG warm-up
        over a SplitMix64-mixed seed, with selectable streams), Pcg32::below
        (Lemire), the shared helpers, and the shared Pcg32 type stored
        directly in saved state. Both roguelikes deliberately invalidate
        their existing saves, replays, and share codes, re-blessing every
        fixture in their own migration PRs; share-code and replay version
        markers bump so old codes are refused rather than misread.
      rationale:
        - >-
          The awkwardness was real and paid daily: every new consumer had to
          choose between four entry points whose differences exist only as
          history, and neither game could store the shared type. Breaking
          pre-release saves once buys a single save-format RNG for the whole
          fleet forever.
        - >-
          The migration is two-phase so the consumer smoke matrix stays green
          throughout: the unified API lands beside the deprecated legacy
          points; each game migrates and re-blesses in its own PR; the legacy
          points are removed once both are off them.

  - decision: saves-are-progress-and-run
    core:
      status: accepted
      confidence: confirmed
      title: A save is Progress or a Run, never one envelope (2026-07-26)
      summary: >-
        vellum-save carries two unrelated concepts under one crate: Progress
        (durable unlocks, totals, settings) migrates through an ordered vN to
        vN+1 chain, and Run (seed, command log, divergence ledger) has no
        migration hook at all, because a run replayed under new rules is a
        different run. One Versions gate covers both — format and rules set by
        hand, content a computed digest — and a refusal names which of the
        three moved. Store is text and RON rather than bytes, so a save stays
        openable by the person diagnosing it; backends (backend-fs,
        backend-web) and the Run half itself sit behind features so a
        Progress-only game compiles no replay engine.
      rationale:
        - >-
          void-and-thunder forced the split into the open: its input is
          continuous analog at 64 Hz, so a command log for it would be an
          input recording rather than a log. It can never be a replay game and
          it still wants totals to survive a refresh. One unified envelope
          would have given it three permanently empty fields.
        - >-
          Content is a digest rather than a number somebody remembers to bump,
          because two games in this fleet learned that the same way.
        - >-
          Integrity, corruption, and divergence are three separate questions —
          the ShareCodec CRC, a record self-hash, and the Run ledger — and one
          field asked to do all three ends up being asked whether a simulation
          changed.
      references:
        - determinism-has-two-tiers
        - new-crates-need-a-consumer

  - decision: phoenix-adopts-the-engine-crates
    core:
      status: accepted
      confidence: confirmed
      title: project-phoenix-v2 re-points four planned PRDs onto vellum (2026-07-26)
      summary: >-
        Phoenix had ten issues planned before this repository grew its crates,
        and they overlapped. Resolved per issue. Its performance PRD (868)
        adopts vellum-perf, which was written to that PRD's shape, and keeps
        only the collectors, baseline files, asset budgets, and reporting the
        crate excludes by charter. Its determinism PRD (849) adopts
        vellum-replay, vellum-digest, and vellum-rng, including the RNG
        unification. Its snapshot PRD (848) and that PRD's children co-author
        vellum-save rather than building a phoenix envelope, with phoenix as
        the world-snapshot consumer. Its composable-templates PRD (869) stays
        in phoenix. Perf, replay, rng, and digest are adoptable at the rev
        phoenix already pins for pasm; vellum-save is not landed yet.
      rationale:
        - >-
          Phoenix is re-blessable tier, so the RNG migration re-blesses its
          determinism fixtures in the adopting PR rather than needing a
          coordinated fleet move. The payoff is concrete: Pcg32 serializes and
          rand's SmallRng does not, so RNG state can enter the snapshot at all.
        - >-
          The snapshot is the one place phoenix could not simply consume:
          Run carries seed, log and ledger with no field for captured world
          state, because neither Wave 2 consumer exercises one. Phoenix is that
          missing consumer, and a private phoenix envelope would have been the
          fleet's second save format before the first one shipped.
        - >-
          869 stays home on merge semantics, not on format: phoenix merges deep
          over toml::Value with by-name and by-id array reconciliation, and
          vellum-compose is shallow over ron::Value and refuses deep merge by
          charter. Phoenix remains the design source for the composition
          scheme, not a consumer of the crate.
      references:
        - saves-are-progress-and-run
        - corpus-and-perf-are-the-next-crates
        - composition-scheme-is-fleet-adoptable
        - determinism-has-two-tiers
        - rng-unification-breaks-saves
        - new-crates-need-a-consumer

  - decision: content-pipeline-is-in-scope
    core:
      status: accepted
      confidence: confirmed
      title: The composition scheme is a shared content pipeline (2026-07-25)
      summary: >-
        The original charter excluded content pipelines as convention-only.
        Reversed: the entity/world composition scheme — templates,
        per-instance overrides, layered worlds, overlay packs, and model
        sidecar files (project-phoenix-v2's *.model.toml rig descriptions,
        wanted in void-and-thunder) — becomes a shared pipeline
        (vellum-compose) integrated across the games over time, built when
        void-and-thunder's data editor needs it. How far one unified
        pipeline can go is answered by adoption, not speculation.
      references:
        - corpus-and-perf-are-the-next-crates
