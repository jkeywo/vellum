<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title><!-- GAME TITLE --></title>
    <!-- Point href at the client crate's manifest and data-bin at its binary. -->
    <link data-trunk rel="rust" href="crates/CLIENT_CRATE/Cargo.toml" data-bin="CLIENT_CRATE" data-wasm-opt="s" />
    <!-- Runtime assets the wasm app fetches (delete if the game embeds everything). -->
    <!-- <link data-trunk rel="copy-dir" href="crates/CLIENT_CRATE/assets" data-target-path="assets" /> -->
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #05050c;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        color: #7a7ab0;
        font: 500 1rem/1.5 system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-align: center;
      }
      /* Fullscreen toggle, floating above the canvas in the HTML layer. Purely
         a browser convenience — the wasm app never sees it. */
      #fullscreen {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
        width: 34px;
        height: 34px;
        padding: 0;
        display: grid;
        place-content: center;
        border: 1px solid #3a3a5c;
        border-radius: 6px;
        background: rgba(12, 12, 24, 0.55);
        color: #b8b8e0;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        backdrop-filter: blur(2px);
      }
      #fullscreen:hover {
        background: rgba(24, 24, 44, 0.8);
        color: #fff;
      }
    </style>
    <!-- Game-specific shims (audio, HUD bridges) go here as their own
         <script> blocks, above </head>. -->
  </head>
  <body>
    <div id="loading">Loading&hellip;<br /><small><!-- GAME TITLE --></small></div>
    <button id="fullscreen" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
    <script>
      // Fullscreen toggle on the whole document so the canvas fills the display.
      (function () {
        const btn = document.getElementById('fullscreen');
        function sync() {
          const on = !!document.fullscreenElement;
          btn.textContent = on ? '✖' : '⛶';
          btn.title = on ? 'Exit fullscreen' : 'Toggle fullscreen';
        }
        btn.addEventListener('click', function () {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            document.documentElement.requestFullscreen().catch(function () {});
          }
        });
        document.addEventListener('fullscreenchange', sync);
        sync();
      })();
    </script>
    <script type="module">
      // Hide the loader once the wasm app has attached its canvas. Bevy
      // creates the canvas itself, so watching the DOM is the reliable
      // signal that startup finished.
      const obs = new MutationObserver(() => {
        if (document.querySelector('canvas')) {
          const l = document.getElementById('loading');
          if (l) l.remove();
          obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
