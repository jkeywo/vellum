[package]
name = "vellum-digest"
description = "Stable state digests and share codes for replay-as-save games."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
postcard = { workspace = true }
base64 = { workspace = true }
ron = { workspace = true, optional = true }

[features]
default = []
# RON digests, for consumers whose fingerprint is over RON text rather than
# postcard bytes. Off by default so a postcard-only consumer does not build it.
ron-digest = ["dep:ron"]

[lints]
workspace = true
